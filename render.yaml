services:
  # ─── FastAPI Backend Web Service ──────────────────────────────────────────
  - type: web
    name: qbank-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Edumate"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./qbank.db"
      - key: AI_PROVIDER
        value: "mock"
      - key: CORS_ORIGINS
        value: '["*"]'
